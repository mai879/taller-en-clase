<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
     <title>Simulador de Prestaciones 2026</title>
</head>
<body>
    <main>
        <h1>Simulador de Nómina y Prestaciones</h1>
                                    <hr>

            <section id="formulario">
        <h3>1. Información Básica</h3>
            <label for="nombreCompleto">Nombre Completo:</label>
              <input type="text" id="nombreCompleto" placeholder="Ej: maicol cediel">
            <label for="edad">Edad (años):</label>
              <input type="number" id="edad" min="0">

            <label for="tipoDocumento">Tipo de Documento:</label>
                <select id="tipoDocumento">
            <option value="RC">RC - Registro Civil</option>
            <option value="TI">TI - Tarjeta de Identidad</option>
            <option value="CC">CC - Cédula de Ciudadanía</option>
            <option value="CE">CE - Cédula de Extranjería</option>
            <option value="PP">PP - Pasaporte</option>
                </select>

            <label for="numeroDocumento">Número de Documento:</label>
            <input type="number" id="numeroDocumento">
 <hr>

        <h3>2. Información Salarial</h3>
            <label for="salario">Salario (COP):</label>
            <input type="number" id="salario" placeholder="0">

            <label for="comisiones">Comisiones (COP):</label>
            <input type="number" id="comisiones" placeholder="0">

  <label for="totalHorasExtra">Total Horas Extra (COP):</label>
            <input type="number" id="totalHorasExtra" placeholder="0">

  <label for="nivelRiesgo">Nivel de Riesgo ARL:</label>
            <select id="nivelRiesgo">
            <option value="Mínimo">I - Mínimo</option>
                 <option value="Bajo">II - Bajo</option>
            <option value="Medio">III - Medio</option>
            <option value="Alto">IV - Alto</option>
            <option value="Máximo">V - Máximo</option>
                </select>
<br><br>
            <button type="button" onclick="realizarCalculos()">Calcular Prestaciones</button>
            </section>

<hr>
    <section id="resultados">
    <h3>3. Resultados del Cálculo</h3>
    <div id="pantallaResultados">
    <p>Complete el formulario para ver los resultados.</p>
</div>
            </section>
            </main>

    <script src="taller.js"></script>
</html>
